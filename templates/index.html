<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Bill Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center mb-6">Electricity Bill Management System</h1>

        <!-- Customer Portal -->
        <div class="mb-8">
            <h2 class="text-2xl font-semibold mb-4">Customer Portal</h2>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-semibold mb-2">Add Customer</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <input id="customerName" type="text" placeholder="Name" class="border p-2 rounded">
                    <input id="customerEmail" type="email" placeholder="Email" class="border p-2 rounded">
                    <input id="customerAddress" type="text" placeholder="Address" class="border p-2 rounded">
                    <input id="customerSection" type="text" placeholder="Section (e.g., Upstairs)" class="border p-2 rounded">
                </div>
                <button onclick="addCustomer()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Add Customer</button>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md mt-4">
                <h3 class="text-xl font-semibold mb-2">View Bills</h3>
                <input id="customerId" type="text" placeholder="Enter Customer ID" class="border p-2 rounded mb-4">
                <button onclick="viewBills()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">View Bills</button>
                <div id="bills" class="mt-4"></div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md mt-4">
                <h3 class="text-xl font-semibold mb-2">Submit Complaint</h3>
                <input id="complaintCustomerId" type="text" placeholder="Customer ID" class="border p-2 rounded mb-2 w-full">
                <textarea id="complaintDescription" placeholder="Describe your issue" class="border p-2 rounded mb-2 w-full"></textarea>
                <button onclick="submitComplaint()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Submit Complaint</button>
            </div>
        </div>

        <!-- Admin Panel -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-semibold mb-4">Admin Panel</h2>
            <button onclick="simulateReadings()" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600 mb-4">Simulate Meter Readings</button>
            <button onclick="generateBills()" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 mb-4 ml-2">Generate Bills</button>

            <h3 class="text-xl font-semibold mb-2">Customers</h3>
            <div id="customers" class="mb-4"></div>

            <h3 class="text-xl font-semibold mb-2">Meter Readings</h3>
            <div id="readings" class="mb-4"></div>

            <h3 class="text-xl font-semibold mb-2">Bills</h3>
            <div id="billsAdmin" class="mb-4"></div>

            <h3 class="text-xl font-semibold mb-2">Complaints</h3>
            <div id="complaints" class="mb-4"></div>
        </div>
    </div>

    <script>
        // Fetch and display customers
        async function fetchCustomers() {
            const response = await fetch('/api/customers');
            const customers = await response.json();
            const customersDiv = document.getElementById('customers');
            customersDiv.innerHTML = customers.map(c => `
                <div class="p-2 border-b">
                    ID: ${c.id}, Name: ${c.name}, Email: ${c.email}, Address: ${c.address}, Section: ${c.section}
                </div>
            `).join('');
        }

        // Add customer
        async function addCustomer() {
            const name = document.getElementById('customerName').value;
            const email = document.getElementById('customerEmail').value;
            const address = document.getElementById('customerAddress').value;
            const section = document.getElementById('customerSection').value;
            await fetch('/api/customers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, address, section })
            });
            fetchCustomers();
        }

        // Simulate meter readings
        async function simulateReadings() {
            await fetch('/api/simulate_readings', { method: 'POST' });
            fetchReadings();
        }

        // Fetch and display meter readings
        async function fetchReadings() {
            const response = await fetch('/api/readings');
            const readings = await response.json();
            const readingsDiv = document.getElementById('readings');
            readingsDiv.innerHTML = readings.map(r => `
                <div class="p-2 border-b">
                    Meter ID: ${r.meter_id}, Section: ${r.section}, Reading: ${r.reading} kWh, Date: ${r.date}
                </div>
            `).join('');
        }

        // Generate bills
        async function generateBills() {
            const response = await fetch('/api/readings');
            const readings = await response.json();
            for (const reading of readings) {
                await fetch('/api/bills', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ meter_id: reading.meter_id })
                });
            }
            fetchBills();
        }

        // Fetch and display bills
        async function fetchBills() {
            const response = await fetch('/api/bills');
            const bills = await response.json();
            const billsDiv = document.getElementById('billsAdmin');
            billsDiv.innerHTML = bills.map(b => `
                <div class="p-2 border-b">
                    Bill ID: ${b.id}, Meter ID: ${b.meter_id}, Section: ${b.section}, Amount: $${b.amount.toFixed(2)}, 
                    Date: ${b.date}, Paid: ${b.paid ? 'Yes' : 'No'}
                    ${!b.paid ? `<button onclick="payBill(${b.id})" class="bg-blue-500 text-white px-2 py-1 rounded ml-2">Pay</button>` : ''}
                </div>
            `).join('');
        }

        // View bills for a customer
        async function viewBills() {
            const customerId = document.getElementById('customerId').value;
            const response = await fetch('/api/bills');
            const bills = await response.json();
            const customerBills = bills.filter(b => {
                return fetch(`/api/customers`).then(res => res.json()).then(customers => {
                    const customer = customers.find(c => c.id == customerId);
                    return customer && b.section === customer.section;
                });
            });
            const billsDiv = document.getElementById('bills');
            billsDiv.innerHTML = customerBills.map(b => `
                <div class="p-2 border-b">
                    Bill ID: ${b.id}, Section: ${b.section}, Amount: $${b.amount.toFixed(2)}, Date: ${b.date}, 
                    Paid: ${b.paid ? 'Yes' : 'No'}
                    ${!b.paid ? `<button onclick="payBill(${b.id})" class="bg-blue-500 text-white px-2 py-1 rounded ml-2">Pay</button>` : ''}
                </div>
            `).join('');
        }

        // Pay bill
        async function payBill(billId) {
            await fetch(`/api/pay/${billId}`, { method: 'POST' });
            fetchBills();
            viewBills();
        }

        // Submit complaint
        async function submitComplaint() {
            const customerId = document.getElementById('complaintCustomerId').value;
            const description = document.getElementById('complaintDescription').value;
            await fetch('/api/complaints', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ customer_id: customerId, description })
            });
            fetchComplaints();
        }

        // Fetch and display complaints
        async function fetchComplaints() {
            const response = await fetch('/api/complaints');
            const complaints = await response.json();
            const complaintsDiv = document.getElementById('complaints');
            complaintsDiv.innerHTML = complaints.map(c => `
                <div class="p-2 border-b">
                    Complaint ID: ${c.id}, Customer: ${c.customer_name}, Description: ${c.description}, 
                    Status: ${c.status}, Date: ${c.date}
                </div>
            `).join('');
        }

        // Initial load
        fetchCustomers();
        fetchReadings();
        fetchBills();
        fetchComplaints();
    </script>
</body>
</html>
